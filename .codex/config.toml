# =============================================================================
# Codex CLI configuration for Sandia sandboxed container
# =============================================================================
# Pre-seeded into /etc/agent-configs/codex/ at build time.
# Entrypoint copies to /root/.codex/config.toml at startup.
# Codex connects to Shirty via nginx proxy using Responses API wire format.
# =============================================================================

################################################################################
# Model & Provider
################################################################################

# Devstral 2 doesn't support the "developer" role codex wants
model = "google/gemma-4-31B-it"
model_provider = "shirty"

# Explicit local metadata registry prevents fallback errors and ensures 
# token-slicing logic respects your full context capacity.
model_catalog_json = "~/.codex/model-catalog.local.json"

# gpt-oss-120b supports 128K tokens
model_context_window = 131072

# Skip ChatGPT OAuth browser flow; use API key auth only
forced_login_method = "api"

# Disabled entirely. No cached results, no live browsing. The agent operates
# on local context only. This also prevents confusing 403 errors from the
# proxy rejecting search-related requests.
web_search = "disabled"
model_reasoning_effort = "medium"

[model_providers.shirty]
name = "Shirty"
base_url = "http://proxy:4000/v1"
env_key = "OPENAI_API_KEY"
wire_api = "responses"
requires_openai_auth = false

################################################################################
# Approval & Sandbox
################################################################################

# "on-request" lets the model decide when to ask. Routine file reads, edits,
# tests, and builds run unattended; the model escalates when uncertain.
approval_policy = "on-request"

# "workspace-write" uses Landlock (Linux) to restrict writes to the workspace
# and /tmp. Also auto-protects .git/ and .codex/ as read-only. This is
# lightweight and free -- keeps the OS sandbox as defense-in-depth even though
# the container is the primary security boundary.
sandbox_mode = "workspace-write"

# Disallow login shells to avoid sourcing .bashrc/.zshrc side effects.
allow_login_shell = false

[sandbox_workspace_write]
# Allow network for spawned commands. Package installs (pip, npm, cargo) route
# through the nginx proxy sidecar which only forwards to Shirty and approved
# package registries. Direct internet access is still blocked at the container
# network level -- the proxy is the only route out.
network_access = true

# Allow /tmp for scratch files (tests, build artifacts, temp data)
exclude_slash_tmp = false
exclude_tmpdir_env_var = false

# Add additional writable paths if needed (e.g., shared volumes):
# writable_roots = ["/data/shared"]

################################################################################
# Web Search
################################################################################

[features]
# Added to natively disable multi-agent routines via config
multi_agent = false

################################################################################
# Shell Environment Policy
################################################################################

[shell_environment_policy]
# "core" inherits only PATH, HOME, USER, SHELL, TERM, LANG, etc.
# Prevents leaking secrets from the container environment into spawned commands.
inherit = "core"

# Strip env vars containing KEY, SECRET, TOKEN, PASSWORD, etc.
ignore_default_excludes = false

# Explicitly exclude cloud/API credentials as an extra layer.
exclude = ["AWS_*", "AZURE_*", "GCP_*", "OPENAI_API_KEY", "ANTHROPIC_*"]

# Inject env vars the agent needs for builds. Uncomment and adjust as needed:
# set = { PYTHONDONTWRITEBYTECODE = "1", CARGO_HOME = "/home/agent/.cargo" }

################################################################################
# History
################################################################################

[history]
persistence = "save-all"
# Cap history at 50MB to avoid unbounded disk use in long-running containers.
max_bytes = 52428800

################################################################################
# Profiles
################################################################################

# Fully autonomous: no approval prompts. Execution policy rules still block
# forbidden commands. Good for `codex exec` / CI-style runs.
[profiles.auto]
approval_policy = "never"
sandbox_mode = "workspace-write"

# Read-only analysis: safe for code review, architecture exploration.
# No file edits, no command execution.
[profiles.readonly]
approval_policy = "never"
sandbox_mode = "read-only"

# Escape hatch for debugging container/proxy issues. NOT for normal use.
[profiles.unrestricted]
approval_policy = "never"
sandbox_mode = "danger-full-access"

[projects."/projects"]
trust_level = "trusted"
