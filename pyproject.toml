[build-system]
requires = ["setuptools >= 64"]
build-backend = "setuptools.build_meta"

[project]
name="conin"
version="1.1.1"
dependencies = [
    "munch",
    "numpy",
    "pandas",
    "pyomo",
    "ovld",
    "smoek",
    ]
readme = {file = "README.md", content-type = "text/markdown"}
description="Conin supports constrained analysis and learning for probabilistic graphical models"
classifiers=[
        "Intended Audience :: End Users/Desktop",
        "Intended Audience :: Science/Research",
        #'License :: OSI Approved :: BSD License',
        "Natural Language :: English",
        #'Operating System :: MacOS',
        #'Operating System :: Microsoft :: Windows',
        "Operating System :: Unix",
        "Programming Language :: Python",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Topic :: Scientific/Engineering :: Mathematics",
        "Topic :: Software Development :: Libraries :: Python Modules",
    ]

[project.scripts]
convert_pgm = "conin.common.bin.convert_pgm:main"

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    ]
test = [
    "pytest",
    "pytest-cov",
    ]
regex = ["greenery"]
pgmpy = ["pgmpy"]
pyagrum = ["pgmpy", "pyagrum"]
pgmax = ["pgmpy", "pgmax"]
pomegranate = ["pgmpy", "pomegranate"]
pgm-all = ["pgmpy", "pyagrum", "pgmax", "pomegranate"]

[tool.setuptools.packages.find]
where = ["."]
include = ["conin*"]

[tool.coverage.report]
exclude_also = [
  'if self.debug:',
  'if debug:',
  'raise AssertionError.*',
  'raise NotImplementedError.*',
  '@(abc.)?abstractmethod',
  'if noisy:',
  'if self.noisy:',
  'pragma: no cover',
  'pass',
  'except Exception as e:',
  'except BaseException:',
  'except ImportError:',
]
