name: conin
channels:
  - conda-forge
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r
  - pytorch
dependencies:
  - munch
  - numpy
  - pandas
  - pip
  - pip:
    - highspy
    - pytoulbar2!=1.4.0.2  # its x86_64 wheels need AVX-512
    - smoek
    - -e git+https://github.com/sandialabs/or_topas.git#egg=or_topas
  - pyomo
